<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="racha">
      <p class="racha-numero">🔥 <span id="racha">0</span></p>
      <p class="racha-texto">días seguidos estudiando</p>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" name="tema" placeholder="¿Qué estudiaste?" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" name="minutos" min="1" step="1" placeholder="Ej: 30" required>

        <button type="submit">Guardar sesión</button>
        <p id="error" class="error"></p>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Mis sesiones</h2>
      <ul id="lista"></ul>
      <p id="vacio">Todavía no hay sesiones. ¡Registra la primera!</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
